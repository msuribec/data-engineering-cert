# Copy these values into Streamlit Community Cloud → App settings → Secrets.
# Never rename this file to secrets.toml and commit real credentials.

[auth]
redirect_uri = "https://YOUR-APP.streamlit.app/oauth2callback"
cookie_secret = "GENERATE_A_LONG_RANDOM_VALUE"
client_id = "YOUR_GOOGLE_OAUTH_CLIENT_ID"
client_secret = "YOUR_GOOGLE_OAUTH_CLIENT_SECRET"
server_metadata_url = "https://accounts.google.com/.well-known/openid-configuration"

[database]
# Use Supabase's Session Pooler URL (port 5432), not the IPv6 direct URL.
url = "postgresql://postgres.PROJECT_REF:URL_ENCODED_PASSWORD@aws-0-REGION.pooler.supabase.com:5432/postgres?sslmode=require"

[app]
# Optional defense-in-depth allowlist. Leave empty to allow every viewer who
# can access the private Streamlit app and authenticate with Google.
allowed_emails = [
  "learner1@example.com",
  "learner2@example.com",
]
